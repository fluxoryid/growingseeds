<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Install GrowingSeeds</title>
<meta name="theme-color" content="#FFE9CE">
<link rel="icon" href="../icons/favicon-32.png">
<style>
  body {
    margin: 0; min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: #FFE9CE; font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
    color: #3E2723; padding: 32px 24px;
  }
  .icon { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(62,39,35,0.18); margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 800; margin: 0 0 20px; }
  .choices { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  a.choice {
    display: block; background: #fff; border-radius: 16px; padding: 18px 26px;
    text-decoration: none; color: #3E2723; font-weight: 700; font-size: 14px;
    box-shadow: 0 3px 10px rgba(62,39,35,0.08); min-width: 130px;
  }
  a.choice .emoji { display: block; font-size: 30px; margin-bottom: 6px; }
</style>
</head>
<body>
  <img class="icon" src="../icons/icon-512.png" alt="GrowingSeeds icon">
  <h1>Install GrowingSeeds on your device</h1>
  <div class="choices">
    <a class="choice" href="./android.html"><span class="emoji">🤖</span>Android</a>
    <a class="choice" href="./ios.html"><span class="emoji">📱</span>iPhone / iPad</a>
  </div>
<script>
// Auto-redirect based on platform so a single shared link "just works" --
// the two dedicated pages above stay directly linkable too, for anyone who
// wants to hand out a platform-specific link on purpose.
const ua = navigator.userAgent || '';
const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
const isAndroid = /Android/.test(ua);
if (isIOS) location.replace('./ios.html');
else if (isAndroid) location.replace('./android.html');
</script>
</body>
</html>
